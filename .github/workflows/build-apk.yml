name: Build APK

on:
  push:
    paths-ignore:
      - 'apk/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Save build log on failure
        if: failure()
        run: |
          mkdir -p apk
          cp build.log apk/build-failed.log || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apk
          git commit -m "Build log (failed) [skip ci]" || true
          git push || true

      - name: Save APK to branch
        run: |
          mkdir -p apk
          rm -f apk/build-failed.log
          cp app/build/outputs/apk/debug/app-debug.apk apk/HomeOrganizer.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A apk
          git commit -m "Add built HomeOrganizer.apk [skip ci]" || true
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: HomeOrganizer-apk
          path: apk/HomeOrganizer.apk
